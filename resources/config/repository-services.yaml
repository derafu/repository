# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/repository/resources/config/repository-services.yaml' }

parameters:
    derafu.repository.sources: {}
    derafu.repository.data_provider.config: {}
    derafu.repository.repository_factory.config: {}

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Derafu\Repository\Contract\RepositoryManagerInterface:
        class: Derafu\Repository\Service\RepositoryManager
        public: true
        arguments:
            $defaultFactory: '@Derafu\Repository\Contract\RepositoryFactoryInterface'
            $dataProvider: '@Derafu\Repository\Contract\DataProviderInterface'
            $factories: !tagged_iterator { tag: 'derafu_repository.repository_factory', index_by: 'repository' }

    Derafu\Repository\Contract\DataProviderInterface:
        class: Derafu\Repository\Service\DataProvider
        arguments:
            $sourceProviders: !tagged_iterator derafu_repository.source_provider
            $sourceResolvers: '@Derafu\Repository\Contract\DataSourceResolverRegistryInterface'
            $cache: null
            $config: '%derafu.repository.data_provider.config%'

    Derafu\Repository\Service\ArrayRepositorySourceProvider:
        arguments:
            $sources: '%derafu.repository.sources%'
        tags: ['derafu_repository.source_provider']

    Derafu\Repository\Contract\RepositoryFactoryInterface:
        class: Derafu\Repository\Factory\DataProviderRepositoryFactory
        arguments:
            $config: '%derafu.repository.repository_factory.config%'

    Derafu\Repository\Contract\CriteriaEvaluatorInterface:
        class: Derafu\Repository\Service\CriteriaEvaluator

    Derafu\Repository\Contract\DataSourceResolverRegistryInterface:
        class: Derafu\Repository\Service\DataSource\DataSourceResolverRegistry
        arguments:
            $resolvers: !tagged_iterator derafu_repository.source_resolver

    Derafu\Repository\Service\DataSource\EnumDataSourceResolver:
        tags:
            - { name: 'derafu_repository.source_resolver', priority: 100 }
    Derafu\Repository\Service\DataSource\FileDataSourceResolver:
        tags:
            - { name: 'derafu_repository.source_resolver', priority: -1000 }

    Derafu\Repository\Contract\FileFormatReaderRegistryInterface:
        class: Derafu\Repository\Service\DataSource\FileFormat\FileFormatReaderRegistry
        arguments:
            $readers: !tagged_iterator derafu_repository.file_format_reader

    Derafu\Repository\Service\DataSource\FileFormat\PhpFileFormatReader:
        tags: ['derafu_repository.file_format_reader']
    Derafu\Repository\Service\DataSource\FileFormat\JsonFileFormatReader:
        tags: ['derafu_repository.file_format_reader']
    Derafu\Repository\Service\DataSource\FileFormat\YamlFileFormatReader:
        tags: ['derafu_repository.file_format_reader']

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Repository\Translation\RepositoryTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
